name: nook-caddy-proxy

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    environment:
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
      CADDY_INGRESS_NETWORKS: nook
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443/tcp"
      - "127.0.0.1:443:443/udp"
      - "127.0.0.1:2019:2019"
    extra_hosts:
      - "host.docker.internal:172.30.0.1"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Even read-only, the Docker socket grants highly privileged daemon access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      nook:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

networks:
  nook:
    name: nook-caddy-proxy-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  caddy_data:
  caddy_config:
