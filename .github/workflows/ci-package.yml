name: Package CI

on:
  push:
    paths:
      - ".github/workflows/ci-package.yml"
      - "packages/nook-run/**"
  pull_request:
    paths:
      - ".github/workflows/ci-package.yml"
      - "packages/nook-run/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-package:
    name: Node package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: packages/nook-run

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.24.0
          install: false

      - name: Install package
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Validate published files
        run: pnpm run pack:check

  package-manager-smoke:
    name: Package manager (${{ matrix.package-manager }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        package-manager: [npm, pnpm, yarn, bun]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        if: ${{ matrix.package-manager == 'pnpm' }}
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.24.0
          install: false

      - name: Install Yarn
        if: ${{ matrix.package-manager == 'yarn' }}
        run: corepack prepare yarn@4.9.2 --activate

      - name: Install Bun
        if: ${{ matrix.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run package-manager smoke test
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: node packages/nook-run/scripts/package-manager-smoke.js
