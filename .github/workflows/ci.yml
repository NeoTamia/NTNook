name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CADDY_VERSION: 2.11.4
  CARGO_TERM_COLOR: always

jobs:
  node-package:
    name: Node package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: packages/nook-run

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install package
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Validate published files
        run: pnpm run pack:check

  package-manager-smoke:
    name: Package manager (${{ matrix.package-manager }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        package-manager: [npm, pnpm, yarn, bun]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        if: ${{ matrix.package-manager == 'pnpm' }}
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install Yarn
        if: ${{ matrix.package-manager == 'yarn' }}
        run: corepack prepare yarn@4.9.2 --activate

      - name: Install Bun
        if: ${{ matrix.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run package-manager smoke test
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: node packages/nook-run/scripts/package-manager-smoke.js

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ca-certificates curl iproute2 openssl python3 util-linux

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Caddy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/caddy.tar.gz
          tar --extract --gzip --file /tmp/caddy.tar.gz --directory "$HOME/.cargo/bin" caddy
          caddy version

      - name: Formatting
        run: cargo fmt --check

      - name: Compile
        run: cargo check --locked

      - name: Validate crates.io package
        run: cargo package --locked

      - name: Test
        run: |
          sudo sysctl --write net.ipv4.ip_unprivileged_port_start=0
          NOOK_E2E_DIRECT=1 cargo test --locked -- --test-threads=1

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: |
          cargo build --locked --release
          install -D -m 0755 target/release/nook dist/nook
          cp README.md RELEASE.md dist/
          cd dist
          sha256sum nook > nook.sha256

      - name: Upload Linux release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nook-linux-x86_64
          path: dist/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Validate Compose files
        run: |
          docker compose -f docker/compose.yaml config --quiet
          docker compose -f docker/compose.caddy-docker-proxy.yaml config --quiet

      - name: Test official Caddy image
        env:
          NOOK_DOCKER_E2E: "1"
        run: tests/docker_e2e.sh

      - name: Test caddy-docker-proxy compatibility
        env:
          NOOK_DOCKER_E2E: "1"
          NOOK_DOCKER_COMPOSE: ${{ github.workspace }}/docker/compose.caddy-docker-proxy.yaml
        run: tests/docker_e2e.sh

      - name: Show Docker diagnostics
        if: failure()
        run: |
          docker ps --all
          docker network ls
          docker volume ls
