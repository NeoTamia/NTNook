name: Publish

on:
  push:
    tags: ["v*", "nook-run-v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CC_x86_64_unknown_linux_musl: musl-gcc
  RELEASE_TARGET: x86_64-unknown-linux-musl

jobs:
  release-assets:
    name: GitHub Release assets
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "ntnook") | .version')"
          test -n "$package_version"
          test "$version" = "$package_version"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add "$RELEASE_TARGET"

      - name: Validate crates.io package
        run: cargo package --locked

      - name: Build release binary
        run: cargo build --locked --release --target "$RELEASE_TARGET"

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="nook-${RELEASE_TARGET}.tar.xz"
          install -D -m 0755 "target/${RELEASE_TARGET}/release/nook" dist/nook
          cp README.md RELEASE.md LICENSE dist/
          tar --create --xz --file "$archive" --directory dist nook README.md RELEASE.md LICENSE
          sha256sum "$archive" > "${archive}.sha256"
          install -m 0755 install.sh nook-installer.sh
          mkdir release-assets
          mv "$archive" "${archive}.sha256" nook-installer.sh release-assets/
          "target/${RELEASE_TARGET}/release/nook" --version | grep --fixed-strings "nook ${version}"

      - name: Attest release assets
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          attempts=0
          until gh release view "$RELEASE_TAG" >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 12 ]; then
              echo "GitHub Release $RELEASE_TAG was not created by Release Please" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  windows-release-assets:
    name: Windows release assets
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: windows-2025
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build Windows release binary
        run: cargo build --locked --release

      - name: Package Windows release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $target = "x86_64-pc-windows-msvc"
          $archive = "nook-$target.zip"
          New-Item -ItemType Directory -Path dist, release-assets | Out-Null
          Copy-Item target/release/nook.exe, README.md, RELEASE.md, LICENSE -Destination dist
          Compress-Archive -Path dist/* -DestinationPath "release-assets/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "release-assets/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "release-assets/$archive.sha256"
          Copy-Item install.ps1 "release-assets/nook-installer.ps1"
          $actual = & target/release/nook.exe --version
          if ($actual -ne "nook $version") { throw "unexpected version: $actual" }

      - name: Attest Windows release assets
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $env:RELEASE_TAG 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 12) { throw "GitHub Release $env:RELEASE_TAG was not created" }
            Start-Sleep -Seconds 5
          }
          gh release upload $env:RELEASE_TAG release-assets/* --clobber

  crates-io:
    name: crates.io
    needs: [release-assets, windows-release-assets]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check crates.io version
        id: crates-io-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if cargo info "ntnook@${version}" --registry crates-io >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: steps.crates-io-version.outputs.published != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.crates-io-version.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  npm:
    name: npm
    if: ${{ startsWith(github.ref_name, 'nook-run-v') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/nook-run
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@12.0.2

      - name: Install pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.24.0
          install: false

      - name: Install package
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#nook-run-v}"
          package_version="$(node --print 'require("./package.json").version')"
          test "$version" = "$package_version"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Test package
        run: |
          pnpm test
          pnpm run pack:check

      - name: Check npm version
        id: npm-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#nook-run-v}"
          if pnpm view "@neotamia/nook-run@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        # npm Trusted Publishing currently supports only npm publish/stage publish.
        run: npm publish --access public
