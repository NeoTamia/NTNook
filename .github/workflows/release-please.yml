name: Release Please Action

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    uses: NeoTamia/actions/.github/workflows/release-please.yml@2bd963bedf9c664e455bb541162bd5ea7fa104a6 # main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  gitflow-release:
    name: Gitflow release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: NeoTamia/actions/.github/workflows/gitflow-release.yml@2bd963bedf9c664e455bb541162bd5ea7fa104a6 # main
    permissions:
      contents: write
    secrets: inherit
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}

  gitflow-nook-run:
    name: Gitflow nook-run release
    needs: release-please
    if: ${{ fromJSON(needs.release-please.outputs.outputs)['packages/nook-run--release_created'] == 'true' }}
    uses: NeoTamia/actions/.github/workflows/gitflow-release.yml@2bd963bedf9c664e455bb541162bd5ea7fa104a6 # main
    permissions:
      contents: write
    secrets: inherit
    with:
      tag-name: ${{ fromJSON(needs.release-please.outputs.outputs)['packages/nook-run--tag_name'] }}
      version: ${{ fromJSON(needs.release-please.outputs.outputs)['packages/nook-run--version'] }}
