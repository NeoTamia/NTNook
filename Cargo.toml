[package]
name = "nook"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5.45", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
serde_json = "1.0.142"
uuid = { version = "1.18.0", features = ["serde", "v4"] }
url = "2.5.7"
ureq = { version = "3.1.0", features = ["json"] }
libc = "0.2.175"
signal-hook = "0.3.18"
base64 = "0.23.1"
ipnet = "2.11.0"
sha2 = "0.11.0"
