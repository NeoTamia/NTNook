[package]
name = "ntnook"
version = "0.6.0"
edition = "2024"
rust-version = "1.97.1"
description = "Expose local applications through stable *.localhost domains using Caddy"
license = "LGPL-3.0-only"
repository = "https://github.com/NeoTamia/NTNook"
readme = "README.md"
keywords = ["localhost", "caddy", "proxy", "development", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
exclude = ["packages/**"]

[[bin]]
name = "nook"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.45", features = ["derive"] }
clap_complete = "4.6.8"
serde = { version = "1.0.219", features = ["derive"] }
toml = "1.0.0"
serde_json = "1.0.142"
uuid = { version = "1.18.0", features = ["serde", "v4"] }
url = "2.5.7"
base64 = "0.23.1"
ipnet = "2.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
lzma-rs = "0.3.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"
signal-hook = "0.4.0"
ureq = { version = "3.1.0", features = ["json"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
ureq = { version = "3.1.0", default-features = false, features = ["gzip", "json", "native-tls"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
